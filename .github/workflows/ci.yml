name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Claude Code (native installer, current version)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Show the Claude Code version
        run: claude --version
      - name: Validate the plugin and marketplace manifests
        run: claude plugin validate .
      - name: Run the unit tests
        run: claude plugin test .
